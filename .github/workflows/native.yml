name: Native verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain version
        run: moon version --all

      - name: Update package registry
        run: moon update

      - name: Check and build
        run: |
          moon check --target native
          moon build --target native

      - name: Run native tests
        run: |
          for test_file in *_wbtest.mbt; do
            echo "::group::${test_file}"
            if [ "$test_file" = tls_wbtest.mbt ]; then
              for index in 0 1 2 3 4; do
                echo "TLS test index ${index}"
                timeout 25s moon test --target native "$test_file" -i "$index"
              done
            else
              timeout 90s moon test --target native --no-parallelize "$test_file"
            fi
            echo "::endgroup::"
          done

      - name: Check generated interfaces and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code

      - name: Inspect release archive
        run: |
          moon package --list
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archives = list(Path('_build/publish').glob('*.zip'))
          assert len(archives) == 1, archives
          with ZipFile(archives[0]) as package:
              files = set(package.namelist())
          required = {
              'moon.mod', 'moon.pkg', 'pkg.generated.mbti',
              'README.md', 'LICENSE', 'auto_client.mbt',
              'moonmqtt.mbt', 'session_store.mbt',
          }
          assert required <= files, required - files
          forbidden = [
              name for name in files
              if name.startswith(('tests/', 'examples/', 'cmd/'))
              or name.endswith(('_test.mbt', '_wbtest.mbt', '.key', '.pem', '.pfx'))
          ]
          assert not forbidden, forbidden
          print(f'Archive verified: {len(files)} files')
          PY
